name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [[ "$os" == windows ]]; then suffix=".exe"; fi

            archive="grok-switch-${VERSION}-${os}-${arch}"
            stage="dist/${archive}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/JasonJarvan/GrokSwitch/internal/cli.Version=${VERSION#v}" \
              -o "${stage}/grok-switch${suffix}" \
              ./cmd/grok-switch
            cp README.md LICENSE "$stage/"

            if [[ "$os" == windows ]]; then
              (cd dist && zip -qr "${archive}.zip" "$archive")
            else
              tar -C dist -czf "dist/${archive}.tar.gz" "$archive"
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum ./* > checksums.txt)
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "GrokSwitch $GITHUB_REF_NAME"
          fi
